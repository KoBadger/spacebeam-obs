name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check with no Qt: this is what a contributor cloning the repo gets
  # before running fetch-deps.ps1.
  filter-only:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        run: |
          # The build links against the installed obs.dll; its import library is
          # generated from the DLL by build.ps1.
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements
          Get-ChildItem 'C:\Program Files\obs-studio\bin\64bit\obs.dll'

      - name: Build (no dock)
        run: .\build.ps1 -RegenerateImportLib

      - name: Sanity check the DLL
        run: |
          $dll = Get-Item build\spacebeam.dll
          Write-Host ("spacebeam.dll: {0} bytes" -f $dll.Length)
          if ($dll.Length -lt 20000) { throw "DLL looks truncated" }
          if (Test-Path build\spacebeam_dock.dll) { throw "dock DLL should not exist" }

      - name: Package and verify (no dock)
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

  # Full artifact. OBS publishes the exact Qt it builds against as a CI
  # dependency (obsproject/obs-deps), so the dock is compiled against Qt 6.11.1
  # - the same version OBS 33 ships. No aqtinstall needed.
  full:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        run: |
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Install Qt (OBS deps bundle)
        run: .\fetch-deps.ps1

      - name: Confirm Qt version
        run: |
          # QT_VERSION_STR lives in QtCore/qconfig.h (Qt 5 used qtcoreversion.h).
          $h = 'deps\qt\include\QtCore\qconfig.h'
          if (-not (Test-Path $h)) { throw "Qt headers missing at $h" }
          $m = Select-String -Path $h -Pattern 'define QT_VERSION_STR\s+"([^"]+)"'
          if (-not $m) { throw "QT_VERSION_STR not found in $h" }
          Write-Host ("Qt {0} (OBS 33 ships 6.11.1)" -f $m.Matches[0].Groups[1].Value)

      - name: Build (with dock)
        run: .\build.ps1 -RegenerateImportLib

      - name: Check DLLs
        run: |
          Get-ChildItem build\*.dll | Format-Table Name, Length
          if (-not (Test-Path build\spacebeam.dll)) { throw "missing spacebeam.dll" }
          if (-not (Test-Path build\spacebeam_dock.dll)) { throw "dock DLL was not built" }

      - name: Package and verify
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: spacebeam-plugin
          path: dist/*.zip
          if-no-files-found: error
