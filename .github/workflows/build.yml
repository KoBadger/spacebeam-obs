name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check: no Qt, so the filter is built on its own. This is what a
  # contributor cloning the repo gets.
  filter-only:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OBS Studio
        run: |
          # The build links against the installed obs.dll; its import library
          # is generated from the DLL by build.ps1.
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements
          Get-ChildItem 'C:\Program Files\obs-studio\bin\64bit\obs.dll'

      - name: Build (no dock)
        run: .\build.ps1 -RegenerateImportLib

      - name: Sanity check the DLL
        run: |
          $dll = Get-Item build\spacebeam.dll
          Write-Host ("spacebeam.dll: {0} bytes" -f $dll.Length)
          if ($dll.Length -lt 20000) { throw "DLL looks truncated" }
          if (Test-Path build\spacebeam_dock.dll) { throw "dock DLL should not exist" }

      - name: Package and verify (no dock)
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

  # Full artifact: adds Qt when it is available so the dock is built too.
  full:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OBS Studio
        run: |
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements

      # Qt is best-effort here: aqt's index advertises versions whose metadata
      # it cannot always download, so CI must not go red because a mirror is
      # incomplete. The published release is built on a workstation against the
      # exact Qt 6.11.1 that OBS 33 ships; this job exists to prove the dock
      # compiles and the archive ships it when Qt is available.
      - name: Install Qt (best effort)
        id: qt
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install --quiet aqtinstall

          $chosen = $null
          foreach ($v in @('6.11.1', '6.10.1', '6.9.3', '6.8.3', '6.8.2', '6.7.3', '6.6.3', '6.5.3')) {
            Write-Host "trying Qt $v"
            & python -m aqt install-qt windows desktop $v win64_msvc2022_64 -O C:\Qt 2>&1 |
              Select-Object -Last 2
            if (Test-Path "C:\Qt\$v\msvc2022_64\include\QtWidgets\QWidget") {
              $chosen = $v
              break
            }
          }

          if (-not $chosen) {
            Write-Warning "no Qt available from aqt; this build will have no dock"
            exit 0
          }

          Write-Host "using Qt $chosen"
          "SB_QT_ROOT=C:\Qt\$chosen\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: .\build.ps1 -RegenerateImportLib

      - name: Check DLLs
        run: |
          Get-ChildItem build\*.dll | Format-Table Name, Length
          if (-not (Test-Path build\spacebeam.dll)) { throw "missing spacebeam.dll" }
          if (Test-Path build\spacebeam_dock.dll) {
            Write-Host "dock built"
          } else {
            Write-Warning "no dock in this build (Qt was unavailable)"
          }

      - name: Package and verify
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: spacebeam-plugin
          path: dist/*.zip
          if-no-files-found: error
