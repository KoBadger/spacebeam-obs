name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  # Fast check with no Qt: this is what a contributor cloning the repo gets
  # before running fetch-deps.ps1.
  filter-only:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        # Local runs already have OBS installed; only the hosted runner needs it.
        if: ${{ !env.ACT }}
        run: |
          # The build links against the installed obs.dll; its import library is
          # generated from the DLL by build.ps1.
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements
          Get-ChildItem 'C:\Program Files\obs-studio\bin\64bit\obs.dll'

      - name: Build (no dock)
        # Force the no-dock path: this job must behave the same on a machine
        # that happens to have Qt installed as on a bare runner.
        run: .\build.ps1 -RegenerateImportLib -NoDock

      - name: Sanity check the DLL
        run: |
          $dll = Get-Item build\spacebeam.dll
          Write-Host ("spacebeam.dll: {0} bytes" -f $dll.Length)
          if ($dll.Length -lt 20000) { throw "DLL looks truncated" }
          if (Test-Path build\spacebeam_dock.dll) { throw "dock DLL should not exist" }

      - name: Package and verify (no dock)
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

  # Full artifact. OBS publishes the exact Qt it builds against as a CI
  # dependency (obsproject/obs-deps), so the dock is compiled against Qt 6.11.1
  # - the same version OBS 33 ships. No aqtinstall needed.
  full:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        if: ${{ !env.ACT }}
        run: |
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Install Qt (OBS deps bundle)
        run: .\fetch-deps.ps1

      - name: Confirm Qt version
        run: |
          # QT_VERSION_STR lives in QtCore/qconfig.h (Qt 5 used qtcoreversion.h).
          $h = 'deps\qt\include\QtCore\qconfig.h'
          if (-not (Test-Path $h)) { throw "Qt headers missing at $h" }
          $m = Select-String -Path $h -Pattern 'define QT_VERSION_STR\s+"([^"]+)"'
          if (-not $m) { throw "QT_VERSION_STR not found in $h" }
          Write-Host ("Qt {0} (OBS 33 ships 6.11.1)" -f $m.Matches[0].Groups[1].Value)

      - name: Build (with dock)
        run: .\build.ps1 -RegenerateImportLib

      - name: Check DLLs
        run: |
          Get-ChildItem build\*.dll | Format-Table Name, Length
          if (-not (Test-Path build\spacebeam.dll)) { throw "missing spacebeam.dll" }
          if (-not (Test-Path build\spacebeam_dock.dll)) { throw "dock DLL was not built" }

      - name: Package and verify
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          name: spacebeam-plugin
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  # Links against the distro libobs (find_package(libobs), pkg-config fallback).
  # The dock stays optional: if the distro has no obs-frontend-api CMake
  # config, CMake builds the filter alone and prints "dock panel disabled".
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install libobs + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libobs-dev qt6-base-dev file

      - name: Prerequisite check
        run: ./fetch-deps.sh

      - name: Build
        run: ./build.sh

      - name: Sanity check the module
        run: |
          ls -l build/spacebeam*.so
          test -f build/spacebeam.so
          file build/spacebeam.so
          ldd build/spacebeam.so | grep -i libobs || echo "note: libobs not in ldd output"

      - name: Package
        run: ./package.sh --no-build

      - uses: actions/upload-artifact@v7
        with:
          name: spacebeam-linux
          path: dist/spacebeam-*
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  # macOS has no libobs dev package (Homebrew's obs-studio is an app cask), so
  # this job builds obs-studio from source first. That is heavy (20-40 min), so
  # it is skipped by default: run it from the Actions tab (workflow_dispatch) or
  # set the repository variable ENABLE_MACOS_CI=true to run it on every push.
  # It is also continue-on-error, because it depends on an out-of-tree OBS build.
  macos:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_MACOS_CI == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Cache obs-studio source + build
        uses: actions/cache@v4
        with:
          path: |
            ~/obs-studio
          key: obs-studio-macos-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: obs-studio-macos-${{ runner.arch }}-

      - name: Install toolchain
        run: brew install cmake ninja qt@6

      - name: Build obs-studio (libobs + obs-frontend-api)
        run: |
          if [ ! -d "$HOME/obs-studio/.git" ]; then
            # Clone a release TAG, not a branch: a --depth 1 branch clone has no
            # reachable tags, so OBS's versionconfig.cmake gets a bare SHA from
            # `git describe --always --tags` and dies in list(GET ... 1) with
            # "list index: 1 out of range". Tagging keeps HEAD == the tag so
            # describe yields x.y.z. (OBS_VERSION_OVERRIDE can't help: the
            # git branch is taken whenever a .git directory exists.)
            TAG="$(git ls-remote --tags --refs --sort=-v:refname \
                   https://github.com/obsproject/obs-studio \
                   | head -n1 | sed 's#.*refs/tags/##')"
            echo "obs-studio tag: $TAG"
            test -n "$TAG"
            git clone --recursive --shallow-submodules --depth 1 --branch "$TAG" \
              https://github.com/obsproject/obs-studio "$HOME/obs-studio"
          fi
          cd "$HOME/obs-studio"
          # OBS refuses any generator but Xcode on macOS
          # (cmake/macos/compilerconfig.cmake: "Building OBS Studio on macOS
          # requires Xcode generator"), and Xcode is multi-config, so the
          # configuration is selected at build/install time, not by
          # CMAKE_BUILD_TYPE.
          cmake -S . -B build -G Xcode \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DENABLE_SCRIPTING=OFF
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix "$HOME/obs-studio/dist"

      - name: Build SpaceBeam
        run: |
          export CMAKE_PREFIX_PATH="$HOME/obs-studio/dist"
          ./fetch-deps.sh || true
          ./build.sh

      - name: Sanity check + package
        run: |
          ls -l build/spacebeam*.so
          test -f build/spacebeam.so
          ./package.sh --no-build
