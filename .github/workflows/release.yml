name: release

# Tag a commit with the version from the VERSION file (e.g. v1.2.7) and this
# builds and publishes the plugin for Windows and Linux, then drafts a GitHub
# release with every asset attached.
#
# Asset names are platform-tagged so a download is never ambiguous:
#   spacebeam-<version>-windows-x64.zip          + .sha256   (manual install)
#   SpaceBeam-<version>-windows-x64-setup.exe    + .sha256   (installer)
#   spacebeam-<version>-linux-x64.zip            + .sha256
# macOS has no release asset yet: there is no libobs dev package, so it builds
# from source -- see docs/BUILDING-UNIX.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and check it matches the tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          test -n "$version" || { echo "::error::VERSION file is empty"; exit 1; }
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$version tag=$tag"
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::Tag $tag does not match VERSION $version - bump VERSION first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        run: |
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Install Qt (OBS deps bundle)
        run: .\fetch-deps.ps1

      - name: Build
        run: .\build.ps1 -RegenerateImportLib

      - name: Package and verify
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

      - name: Install Inno Setup
        run: |
          winget install --id JRSoftware.InnoSetup --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Build the installer
        # Unsigned unless these repository secrets exist; installer.ps1 falls
        # back to an unsigned build and says so.
        env:
          SB_SIGN_CERT_B64: ${{ secrets.SB_SIGN_CERT_B64 }}
          SB_SIGN_PASSWORD: ${{ secrets.SB_SIGN_PASSWORD }}
        run: .\installer.ps1 -NoBuild

      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist\*windows-x64*" release-assets\
          $expected = @(
            "spacebeam-${{ needs.check-version.outputs.version }}-windows-x64.zip",
            "SpaceBeam-${{ needs.check-version.outputs.version }}-windows-x64-setup.exe"
          )
          foreach ($e in $expected) {
            if (-not (Test-Path (Join-Path 'release-assets' $e))) { throw "missing asset: $e" }
          }
          Get-ChildItem release-assets | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install libobs + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libobs-dev qt6-base-dev zip

      - name: Build
        run: ./build.sh

      - name: Package
        run: ./package.sh --no-build

      - name: Collect assets
        run: |
          mkdir -p release-assets
          cp dist/*linux-x64* release-assets/
          ls -l release-assets
          test -f "release-assets/spacebeam-${{ needs.check-version.outputs.version }}-linux-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [check-version, windows, linux]
    runs-on: ubuntu-latest
    # Drafts rather than publishes, so a human checks the assets first. This job
    # has been refused release creation on some runs ("Resource not accessible by
    # integration"); when that happens scripts\release.ps1 publishes locally
    # instead, and a failure here must not fail an otherwise good build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: List assets
        run: |
          set -euo pipefail
          find assets -type f | sort

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f | sort)
          printf 'attaching %d file(s)\n' "${#files[@]}"
          # Draft, not published: a human checks the assets before they go live.
          gh release create "${{ needs.check-version.outputs.tag }}" "${files[@]}" \
            --title "SpaceBeam for OBS ${{ needs.check-version.outputs.version }}" \
            --notes-file CHANGELOG.md \
            --draft \
            --target "${{ github.sha }}"
