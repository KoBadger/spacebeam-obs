name: release

# Tag a commit with the version from the VERSION file (e.g. v1.1.2) and this
# builds the dock-enabled plugin with OBS's own Qt, verifies the archive, and
# drafts a GitHub release with the zip and its checksum attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install OBS Studio
        run: |
          winget install --id OBSProject.OBSStudio --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Install Qt (OBS deps bundle)
        run: .\fetch-deps.ps1

      - name: Build
        run: .\build.ps1 -RegenerateImportLib

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "VERSION=$version tag=$tag"
          if ($version -ne $tag) {
            throw "Tag $tag does not match VERSION $version - bump VERSION first."
          }

      - name: Package and verify
        run: |
          .\package.ps1 -NoBuild
          .\tests\verify-package.ps1

      - name: Install Inno Setup
        run: |
          winget install --id JRSoftware.InnoSetup --silent `
            --accept-package-agreements --accept-source-agreements

      - name: Build the installer
        run: .\installer.ps1 -NoBuild

      - name: Publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "dist\spacebeam-$version.zip"
          $sum = "$zip.sha256"
          $setup = "dist\SpaceBeam-$version-setup.exe"
          $setupSum = "$setup.sha256"
          foreach ($f in @($zip, $sum, $setup, $setupSum)) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

          # Draft, not published: a human checks the assets before they go live.
          gh release create "${{ github.ref_name }}" $zip $sum $setup $setupSum `
            --title "SpaceBeam for OBS $version" `
            --notes-file CHANGELOG.md `
            --draft `
            --target "${{ github.sha }}"
